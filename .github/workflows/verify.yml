name: Production verification
on:
  push:
    branches: ['main', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown
      - run: python -m pip install -r requirements-dev.txt
      - run: pnpm audit:handoff && pnpm validate:contracts
      - run: pnpm build
      - run: pnpm lint && pnpm typecheck
      - run: pnpm test:unit && pnpm test:integration && pnpm test:security
      - run: pnpm exec playwright install --with-deps chromium webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: .cache/browsers
      - run: pnpm test:e2e
      - name: Retain exact-commit reports and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-verification-${{ github.sha }}
          path: |
            evidence/browser-results.json
            evidence/M9/*.json
            evidence/M9/*.png
            evidence/M5/*.png
            evidence/M1/*.png
          if-no-files-found: error
          retention-days: 14
