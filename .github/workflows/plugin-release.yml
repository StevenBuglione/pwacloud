name: Signed plugin reference packages
on:
  push:
    tags: ['plugin-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'StevenBuglione/pwacloud' && github.event.repository.private == false && startsWith(github.ref, 'refs/tags/plugin-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown
      - run: pnpm build
      - run: pnpm lint && pnpm typecheck && pnpm test:unit && pnpm test:integration && pnpm test:security
      - run: pnpm exec tsx scripts/build-packages.ts --release
      - name: Generate dependency inventories
        run: |
          pnpm licenses list --json > artifacts/release-packages/dependency-licenses.json
          pnpm list --depth Infinity --json > artifacts/release-packages/dependency-tree.json
          cargo metadata --locked --format-version 1 --manifest-path examples/guest/Cargo.toml > artifacts/release-packages/cargo-metadata.json
          pnpm exec tsx packages/cli/src/sbom-main.ts artifacts/release-packages/dependency-tree.json artifacts/release-packages/sbom.cdx.json artifacts/release-packages/dependency-licenses.json artifacts/release-packages/cargo-metadata.json
          cp LICENSE artifacts/release-packages/LICENSE.txt
      - name: Check archive determinism
        run: |
          find artifacts/release-packages -name archive.zip -print0 | sort -z | xargs -0 sha256sum > /tmp/pwacloud-before.txt
          pnpm exec tsx scripts/build-packages.ts --release
          find artifacts/release-packages -name archive.zip -print0 | sort -z | xargs -0 sha256sum > /tmp/pwacloud-after.txt
          diff /tmp/pwacloud-before.txt /tmp/pwacloud-after.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-plugin-reference-packages
          path: artifacts/release-packages/
          if-no-files-found: error
          retention-days: 14
  sign:
    needs: build
    if: github.repository == 'StevenBuglione/pwacloud' && github.event.repository.private == false && startsWith(github.ref, 'refs/tags/plugin-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-plugin-reference-packages
          path: artifacts/release-packages/
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign exact archive and envelope bytes and verify identity
        env:
          EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/plugin-release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          for id in notebook feed-reader canvas-board; do
            for file in archive.zip envelope.json; do
              path="artifacts/release-packages/$id/$file"
              cosign sign-blob --yes --bundle "$path.sigstore.json" "$path"
              cosign verify-blob --bundle "$path.sigstore.json" --certificate-identity "$EXPECTED_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$path"
            done
          done
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: provenance
        with:
          subject-path: |
            artifacts/release-packages/*/archive.zip
            artifacts/release-packages/*/envelope.json
          create-storage-record: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: sbom
        with:
          subject-path: artifacts/release-packages/*/archive.zip
          sbom-path: artifacts/release-packages/sbom.cdx.json
          create-storage-record: false
      - name: Prepare public assets without fixture trust
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/public
          for id in notebook feed-reader canvas-board; do
            for file in archive.zip envelope.json archive.zip.sigstore.json envelope.json.sigstore.json; do
              cp "artifacts/release-packages/$id/$file" "artifacts/public/$id.$file"
            done
          done
          cp "$PROVENANCE_BUNDLE" artifacts/public/provenance.sigstore.json
          cp "$SBOM_BUNDLE" artifacts/public/sbom.sigstore.json
          cp artifacts/release-packages/dependency-licenses.sanitized.json artifacts/public/dependency-licenses.json
          cp artifacts/release-packages/sbom.cdx.json artifacts/public/sbom.cdx.json
          cp artifacts/release-packages/LICENSE.txt artifacts/public/LICENSE.txt
          sha256sum artifacts/public/* > artifacts/public/SHA256SUMS.txt
      - name: Publish reference package release
        env:
          GH_TOKEN: ${{ github.token }}
          PWACLOUD_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$PWACLOUD_RELEASE_TAG" artifacts/public/* --repo "$GITHUB_REPOSITORY" --verify-tag --latest --title "Signed plugin reference packages $PWACLOUD_RELEASE_TAG" --notes-file docs/PACKAGE-RELEASE-NOTES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-plugin-reference-packages
          path: artifacts/public/
          if-no-files-found: error
          retention-days: 30
