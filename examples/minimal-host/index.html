<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PWACloud minimal host</title><style>body{font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:16px;color:#1d2935;background:#f6f8f7}button{font:inherit;min-height:48px;padding:10px 12px;background:#fff;color:#165f4d;border:1px solid #bac6d0;border-radius:8px;margin:4px}button:focus-visible{outline:3px solid #258269}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:1.4rem}#viewport{height:calc(100dvh - 220px);min-height:420px}iframe{border:1px solid #bac6d0;border-radius:8px;width:100%;height:100%;display:block}#status{font-size:.9rem;line-height:1.5}#library{display:flex;gap:8px;flex-wrap:wrap}#review{border:1px solid #bac6d0;border-radius:12px;padding:16px;max-width:500px}label{display:flex;gap:12px;align-items:center;margin:12px 0}input{width:24px;height:24px}#review p{overflow-wrap:anywhere}</style></head><body><header><h1>PWACloud minimal host</h1><a href="/">Reference shell</a><button id="close" type="button">Close app</button></header><p>This second host uses the same public framework packages, without Ionic or shell imports.</p><div id="library" aria-label="Installed apps"></div><section id="review" hidden aria-labelledby="review-title"><h2 id="review-title">Review Notebook</h2><p id="package-detail"></p><div id="permissions"></div><button id="install" type="button">Install reviewed app</button><button id="cancel" type="button">Cancel</button></section><p id="status" role="status">Opening reusable host…</p><div id="viewport"></div><script type="module" src="/minimal/main.js"></script></body></html>
